services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: live-monitoring
      SYSTEM_MODE: LIVE_MONITORING
      LIVE_MONITORING_AUTOSTART: "true"
      LIVE_HISTORY_RETENTION_SECONDS: "86400"
      LIVE_HISTORY_QUERY_MAX: "1000"
      LIVE_HISTORY_PRUNE_EVERY_WRITES: "1000"
      DATABASE_URL: postgresql+asyncpg://prediction:prediction@postgres:5432/prediction_quant
      REDIS_URL: redis://redis:6379/0
      PERSISTENCE_ENABLED: "true"
      HTTP_RATE_LIMIT_PER_MINUTE: "600"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/live/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prediction_quant
      POSTGRES_USER: prediction
      POSTGRES_PASSWORD: prediction
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prediction -d prediction_quant"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - proto_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/live-alerts.yml:/etc/prometheus/live-alerts.yml:ro
      - proto_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: proto
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-proto-local-dev}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - proto_grafana:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  proto_pgdata:
  proto_prometheus:
  proto_grafana:
