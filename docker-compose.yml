services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: development
      APP_MODE: SIMULATION
      DATABASE_URL: postgresql://proto:proto@postgres:5432/proto
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proto
      POSTGRES_USER: proto
      POSTGRES_PASSWORD: proto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proto -d proto"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - proto_pgdata:/var/lib/postgresql/data

volumes:
  proto_pgdata:
