name: Render Control Room

# Renders on demand and uploads the artwork for review. It never commits: a commit pushed with
# GITHUB_TOKEN triggers no workflows, so the PR head would carry no CI. Commit the reviewed
# assets from a workstation instead (python tools/render_control_room/render.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.repository == 'dossantostampafl-lab/Proto'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install renderer
        run: python -m pip install 'bpy==5.2.3' pillow numpy
      - name: Render native wide and portrait scenes plus robot animation
        run: python tools/render_control_room/render.py --samples 64
      - name: Check render and anchors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("apps/web")
          limits = {"room.webp": 700_000, "room-portrait.webp": 700_000, "robot.webp": 700_000}
          for name, limit in limits.items():
              asset = root / "public/floorcontrol" / name
              assert asset.exists() and asset.stat().st_size < limit, (str(asset), limit)
              with Image.open(asset) as image:
                  image.verify()
              print(name, asset.stat().st_size, "bytes")
          anchors = json.loads((root / "src/views/floorControl/anchors.json").read_text())
          for kind in ("landscape", "portrait"):
              view = anchors[kind]
              assert view["seats"] and len(view["seats"]) >= 50, kind
              assert 0 < view["globe"]["radius"] < 0.3, kind
              assert all(len(seat["seat"]) == 2 for seat in view["seats"]), kind
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify frontend build
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run contract-check
          npm run build
          npm run bundle-check
      - name: Capture desktop/mobile actual UI without WebGL
        run: |
          python -m pip install -e '.[dev]' playwright
          python -m playwright install chromium --with-deps
          python scripts/check_control_browser.py --output /tmp/proto-floor-screenshots
      - name: Attach reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-review-screenshots
          path: /tmp/proto-floor-screenshots/*.png
          if-no-files-found: ignore
      - name: Attach rendered artwork and anchors
        uses: actions/upload-artifact@v4
        with:
          name: control-room-artwork
          path: |
            apps/web/public/floorcontrol/*.webp
            apps/web/src/views/floorControl/anchors.json
