name: Market Explorer Contract

on:
  push:
    branches: [feat/market-explorer-v3]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Market Explorer contract
        run: node apps/web/scripts/autonomy-control-deck-contract-check.mjs
