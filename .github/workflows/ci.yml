name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check apps services tests
      - run: pytest

  mutation-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Mutate reconciliation safety boundary
        run: mutmut run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        env:
          PROTO_DB_PASSWORD: ci-placeholder-only
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-only
          # Path only: the research sidecar reads its key from a local file, never from the repo.
          PROTO_RESEARCH_LLM_KEY_FILE: /dev/null
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.live.yml config > /dev/null
          docker compose -f docker-compose.research.yml config > /dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run contract-check
      - run: npm run build
      - run: npm run bundle-check
