name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check apps services tests scripts
      - run: pytest

  live-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Validate standalone live compose
        env:
          PROTO_DB_PASSWORD: ci-placeholder-only
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-only
        run: docker compose -f docker-compose.live.yml config > /tmp/proto-live-compose.yml
      - name: Run live recovery and release-contract gates
        run: >-
          pytest
          tests/chaos/test_live_monitor_recovery.py
          tests/chaos/test_live_backup_restore.py
          tests/unit/test_live_staging_contract.py
          tests/unit/test_live_isolation.py
          tests/unit/test_live_release_surface.py

  live-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build standalone live image
        run: docker build -f Dockerfile.api -t proto-live:ci .
      - name: Verify nonroot image identity
        run: test "$(docker inspect --format '{{.Config.User}}' proto-live:ci)" = "proto:proto"
      - name: Start hardened read-only container
        run: >-
          docker run -d --name proto-live-smoke
          --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges
          -p 127.0.0.1:18000:8000
          -e SYSTEM_MODE=LIVE_MONITORING
          -e LIVE_MONITORING_AUTOSTART=false
          -e PERSISTENCE_ENABLED=false
          proto-live:ci
      - name: Verify health invariants and HTTP read-only surface
        run: python scripts/live_image_smoke.py
      - name: Show container logs
        if: always()
        run: docker logs proto-live-smoke || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f proto-live-smoke || true

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
