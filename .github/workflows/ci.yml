name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check apps services tests
      - run: python -m mypy --explicit-package-bases services/security/live_data_policy.py services/market_data/live.py apps/api/app/live.py
      - run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  integration:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build postgres api
      - name: Wait for API and PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api postgres
          exit 1
      - run: curl --fail --silent http://localhost:8000/metrics/prometheus
      - if: always()
        run: docker compose down --volumes

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e . cyclonedx-bom
      - run: cyclonedx-py environment --of JSON -o sbom-python.json
      - run: npm ci
        working-directory: apps/web
      - run: npm sbom --sbom-format cyclonedx > ../../sbom-web.json
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: proto-sbom
          path: sbom-*.json

