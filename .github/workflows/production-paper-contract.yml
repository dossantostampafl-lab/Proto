name: Production Paper Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-paper-contract-main
  cancel-in-progress: true

jobs:
  railway-paper-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROTO_PUBLIC_ORIGIN: https://proto-production-5b0d.up.railway.app
      EXPECTED_PROTO_RELEASE: proto-brain-control-plane-v2
    steps:
      - name: Verify deployed paper lifecycle contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          origin = os.environ["PROTO_PUBLIC_ORIGIN"].rstrip("/")
          expected_release = os.environ["EXPECTED_PROTO_RELEASE"]
          last_error = None

          def request(path: str):
              req = urllib.request.Request(
                  f"{origin}{path}",
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "proto-paper-contract/2.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return (
                      response.status,
                      {name.lower(): value for name, value in response.headers.items()},
                      response.read(),
                  )

          def get_json(path: str):
              status, _, body = request(path)
              return status, json.loads(body.decode("utf-8"))

          for attempt in range(1, 121):
              try:
                  root_status, root_headers, _ = request("/")
                  if root_status != 200:
                      raise AssertionError(f"/ returned HTTP {root_status}")
                  deployed_release = root_headers.get("x-proto-release")
                  if deployed_release != expected_release:
                      raise AssertionError(
                          "paper gate is observing a stale deployment: "
                          f"expected={expected_release!r} got={deployed_release!r}"
                      )

                  status, paper = get_json("/paper/status")
                  if status != 200:
                      raise AssertionError(f"paper status HTTP {status}")
                  if "autopilot_running" not in paper:
                      raise AssertionError("deployed paper status predates coupled autopilot lifecycle")
                  if paper.get("financial_connectivity") is not False:
                      raise AssertionError("paper status violated no-financial-connectivity boundary")
                  if paper.get("real_money_execution") is not False:
                      raise AssertionError("paper status violated no-real-money boundary")

                  status, autopilot = get_json("/paper/automation/status")
                  if status != 200:
                      raise AssertionError(f"autopilot status HTTP {status}")
                  if "live_market_ready" not in autopilot:
                      raise AssertionError("deployed autopilot predates authoritative live-readiness gating")
                  if autopilot.get("financial_connectivity") is not False:
                      raise AssertionError("autopilot violated no-financial-connectivity boundary")
                  if autopilot.get("real_money_execution") is not False:
                      raise AssertionError("autopilot violated no-real-money boundary")
                  if bool(paper.get("autopilot_running")) != bool(autopilot.get("running")):
                      raise AssertionError(
                          "paper/autopilot running state is inconsistent: "
                          f"paper={paper.get('autopilot_running')!r} "
                          f"autopilot={autopilot.get('running')!r}"
                      )

                  print(
                      "production paper contract: ok",
                      json.dumps(
                          {
                              "release": deployed_release,
                              "mode": paper.get("mode"),
                              "paper_execution_enabled": paper.get("paper_execution_enabled"),
                              "autopilot_running": paper.get("autopilot_running"),
                              "live_market_ready": autopilot.get("live_market_ready"),
                          },
                          sort_keys=True,
                      ),
                  )
                  break
              except (
                  AssertionError,
                  json.JSONDecodeError,
                  urllib.error.URLError,
                  TimeoutError,
                  OSError,
              ) as error:
                  last_error = error
                  print(f"attempt {attempt}/120 not ready: {type(error).__name__}: {error}")
                  if attempt == 120:
                      raise
                  time.sleep(5)
          else:
              raise RuntimeError(f"paper contract exhausted retries: {last_error}")
          PY
