name: Deploy

# Pull-based deploy to Oracle Cloud (docs/runbooks/oracle-setup.md, "Deploy from GitHub").
# This workflow only publishes images. It holds no Oracle credential and reaches no instance:
# each instance pulls its own tag on a timer. Merging to main with green CI is the deploy.
#   :stable    the API and the watchdog follow it automatically
#   :executor  the executor follows it, only after an operator approves the "executor"
#              environment (Settings > Environments > executor > Required reviewers)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/proto

jobs:
  image:
    # Only a green CI run of a push to main, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm  # the instances are Ampere A1 (arm64)
    # Images publish one at a time. This lock is per job, so an executor approval still
    # waiting never holds back the next :stable image.
    concurrency:
      group: deploy-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE }}:stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}

  executor:
    # The executor holds the venue credentials: its image moves only on an operator's approval.
    needs: image
    runs-on: ubuntu-latest
    environment: executor
    # Only the newest image waits for approval: a newer run cancels an older pending one.
    concurrency:
      group: deploy-executor
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :executor at the approved digest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:executor" "$IMAGE@${{ needs.image.outputs.digest }}"
          echo "executor -> sha-${{ needs.image.outputs.sha }} (${{ needs.image.outputs.digest }})" \
            >> "$GITHUB_STEP_SUMMARY"
