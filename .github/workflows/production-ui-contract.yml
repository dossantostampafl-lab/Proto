name: Production UI Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ui-contract-main
  cancel-in-progress: true

jobs:
  railway-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PROTO_PUBLIC_ORIGIN: https://proto-production-5b0d.up.railway.app
      EXPECTED_UI_RELEASE: model-quality-persisted-v4
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed dashboard UI generation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          origin = os.environ["PROTO_PUBLIC_ORIGIN"].rstrip("/")
          expected_release = os.environ["EXPECTED_UI_RELEASE"]
          expected_source_sha = hashlib.sha256(
              Path("apps/web/src/approved-terminal.tsx").read_bytes()
          ).hexdigest()
          last_error = None

          for attempt in range(1, 61):
              try:
                  request = urllib.request.Request(
                      f"{origin}/",
                      headers={"User-Agent": "proto-ui-contract/2.0"},
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      body = response.read().decode("utf-8")
                      headers = {name.lower(): value for name, value in response.headers.items()}
                  if '<div id="root"></div>' not in body:
                      raise AssertionError("dashboard React root is missing")
                  actual_release = headers.get("x-proto-ui-release")
                  if actual_release != expected_release:
                      raise AssertionError(
                          "UI release mismatch: "
                          f"expected={expected_release!r} got={actual_release!r}"
                      )
                  actual_source_sha = headers.get("x-proto-ui-source-sha256")
                  if actual_source_sha != expected_source_sha:
                      raise AssertionError(
                          "deployed UI source digest mismatch: "
                          f"expected={expected_source_sha!r} got={actual_source_sha!r}"
                      )
                  if "no-store" not in headers.get("cache-control", ""):
                      raise AssertionError("dashboard HTML cache policy is not no-store")
                  print(
                      "production UI contract: ok "
                      f"release={actual_release} source_sha256={actual_source_sha}"
                  )
                  break
              except (AssertionError, urllib.error.URLError, TimeoutError) as error:
                  last_error = error
                  print(f"attempt {attempt}/60 not ready: {type(error).__name__}: {error}")
                  if attempt == 60:
                      raise
                  time.sleep(5)
          else:
              raise RuntimeError(f"UI contract exhausted retries: {last_error}")
          PY
