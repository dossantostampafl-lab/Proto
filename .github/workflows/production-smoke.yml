name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  railway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROTO_PUBLIC_ORIGIN: https://proto-production-5b0d.up.railway.app
      EXPECTED_PROTO_RELEASE: proto-brain-control-plane-v3
    steps:
      - name: Validate deployed dashboard and live safety contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          origin = os.environ["PROTO_PUBLIC_ORIGIN"].rstrip("/")
          expected_release = os.environ["EXPECTED_PROTO_RELEASE"]
          last_error: Exception | None = None

          def request(path: str):
              req = urllib.request.Request(
                  f"{origin}{path}",
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "proto-production-smoke/3.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  headers = {name.lower(): value for name, value in response.headers.items()}
                  return response.status, headers, response.read()

          def json_get(path: str) -> dict:
              status, _, body = request(path)
              if status != 200:
                  raise AssertionError(f"{path} returned HTTP {status}")
              return json.loads(body.decode("utf-8"))

          for attempt in range(1, 61):
              try:
                  root_status, root_headers, root_body = request("/")
                  if root_status != 200:
                      raise AssertionError(f"/ returned HTTP {root_status}")
                  html = root_body.decode("utf-8")
                  if '<div id="root"></div>' not in html:
                      raise AssertionError("dashboard React root is missing")
                  if "no-store" not in root_headers.get("cache-control", ""):
                      raise AssertionError("dashboard HTML is missing no-store cache policy")
                  if not root_headers.get("content-security-policy"):
                      raise AssertionError("dashboard CSP header is missing")
                  if root_headers.get("x-frame-options") != "DENY":
                      raise AssertionError("dashboard frame protection is missing")
                  deployed_release = root_headers.get("x-proto-release")
                  if deployed_release != expected_release:
                      raise AssertionError(
                          f"deployment release mismatch: expected={expected_release!r} got={deployed_release!r}"
                      )

                  health = json_get("/health")
                  if health.get("status") != "ok":
                      raise AssertionError(f"health status is not ok: {health!r}")

                  live = json_get("/live/status")
                  if live.get("running") is not True or live.get("receiving_data") is not True:
                      raise AssertionError("live monitor is not receiving public data")
                  if live.get("complete") is not True:
                      raise AssertionError("live symbol coverage is incomplete")
                  fresh = set(live.get("fresh_symbols") or [])
                  if not {"BTC", "ETH", "SOL"}.issubset(fresh):
                      raise AssertionError(f"live symbols are not all fresh: {sorted(fresh)!r}")
                  if live.get("financial_connectivity") is not False:
                      raise AssertionError("live surface violated no-financial-connectivity boundary")
                  if live.get("real_money_execution") is not False:
                      raise AssertionError("live surface violated no-real-money boundary")

                  market = json_get("/live/market-data/BTC")
                  for field in ("bid", "ask", "mid", "sequence", "connection_generation"):
                      if market.get(field) is None:
                          raise AssertionError(f"BTC live snapshot missing {field}")
                  if not (market["bid"] <= market["mid"] <= market["ask"]):
                      raise AssertionError("BTC live quote violates bid <= mid <= ask")

                  analytics = json_get("/live/analytics/BTC")
                  for field in (
                      "realized_volatility",
                      "current_spread_bps",
                      "current_imbalance",
                      "current_microprice",
                  ):
                      if analytics.get(field) is None:
                          raise AssertionError(f"BTC analytics missing {field}")

                  history = json_get("/live/history/BTC?limit=1")
                  if history.get("source") != "PUBLIC_READ_ONLY_PERSISTED":
                      raise AssertionError("persisted history provenance is not public-read-only")
                  if history.get("financial_connectivity") is not False:
                      raise AssertionError("persisted history violated financial-connectivity boundary")
                  if history.get("real_money_execution") is not False:
                      raise AssertionError("persisted history violated real-money boundary")

                  universe = json_get("/universe")
                  registered = {
                      item.get("instrument_id")
                      for item in universe.get("instruments", [])
                      if isinstance(item, dict)
                  }
                  if not {"CRYPTO:BTC", "CRYPTO:ETH", "CRYPTO:SOL"}.issubset(registered):
                      raise AssertionError(f"core universe is incomplete: {sorted(registered)!r}")
                  if universe.get("financial_connectivity") is not False:
                      raise AssertionError("universe violated financial-connectivity boundary")
                  if universe.get("real_money_execution") is not False:
                      raise AssertionError("universe violated real-money boundary")

                  creation = json_get("/creation/status")
                  if creation.get("accepted_origin") != "THE_CREATION":
                      raise AssertionError("Creation bridge origin contract is wrong")
                  if creation.get("financial_connectivity") is not False:
                      raise AssertionError("Creation bridge violated financial-connectivity boundary")
                  if creation.get("real_money_execution") is not False:
                      raise AssertionError("Creation bridge violated real-money boundary")

                  system = json_get("/system/status")
                  risk = json_get("/risk")
                  paper = json_get("/paper/status")
                  autopilot = json_get("/paper/automation/status")
                  mode = system.get("mode")
                  known_modes = {
                      "SIMULATION",
                      "PAPER_TRADING",
                      "HISTORICAL_REPLAY",
                      "LIVE_MONITORING",
                      "SHADOW",
                  }
                  if mode not in known_modes:
                      raise AssertionError(f"unexpected runtime mode: {mode!r}")
                  if risk.get("mode") != mode:
                      raise AssertionError("risk/runtime mode mismatch")
                  if paper.get("mode") != mode or autopilot.get("mode") != mode:
                      raise AssertionError("paper/autopilot runtime mode mismatch")
                  for name, surface in (("risk", risk), ("paper", paper), ("autopilot", autopilot)):
                      if surface.get("financial_connectivity") is not False:
                          raise AssertionError(f"{name} violated financial-connectivity boundary")
                      if surface.get("real_money_execution") is not False:
                          raise AssertionError(f"{name} violated real-money boundary")

                  expected_simulation_allowed = bool(
                      mode in {"SIMULATION", "PAPER_TRADING"}
                      and system.get("running") is True
                      and system.get("kill_switch") == "ARMED"
                  )
                  if risk.get("simulation_allowed") is not expected_simulation_allowed:
                      raise AssertionError("risk simulation_allowed is inconsistent with runtime")

                  expected_paper_enabled = bool(
                      mode == "PAPER_TRADING"
                      and system.get("running") is True
                      and system.get("kill_switch") == "ARMED"
                  )
                  if paper.get("paper_execution_enabled") is not expected_paper_enabled:
                      raise AssertionError("paper_execution_enabled is inconsistent with runtime")
                  if autopilot.get("paper_runtime_ready") is not expected_paper_enabled:
                      raise AssertionError("autopilot paper_runtime_ready is inconsistent with runtime")

                  print(
                      "production smoke: ok",
                      json.dumps(
                          {
                              "origin": origin,
                              "release": deployed_release,
                              "runtime_mode": mode,
                              "fresh_symbols": sorted(fresh),
                              "registered_instruments": sorted(registered),
                              "creation_configured": creation.get("configured"),
                              "live_generation": market.get("connection_generation"),
                              "live_sequence": market.get("sequence"),
                          },
                          sort_keys=True,
                      ),
                  )
                  break
              except (
                  AssertionError,
                  KeyError,
                  ValueError,
                  json.JSONDecodeError,
                  urllib.error.URLError,
                  TimeoutError,
                  OSError,
              ) as error:
                  last_error = error
                  print(f"attempt {attempt}/60 not ready: {type(error).__name__}: {error}")
                  if attempt == 60:
                      raise
                  time.sleep(10)
          else:
              raise RuntimeError(f"production smoke exhausted retries: {last_error}")
          PY
