name: Production Event Journal Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-event-journal-main
  cancel-in-progress: true

jobs:
  railway-event-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROTO_PUBLIC_ORIGIN: https://proto-production-5b0d.up.railway.app
      EXPECTED_PROTO_RELEASE: proto-brain-control-plane-v2
    steps:
      - name: Verify deployed operational journal integrity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          origin = os.environ["PROTO_PUBLIC_ORIGIN"].rstrip("/")
          expected_release = os.environ["EXPECTED_PROTO_RELEASE"]
          last_error = None

          def request(path: str):
              req = urllib.request.Request(
                  f"{origin}{path}",
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "proto-event-journal-contract/2.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return (
                      response.status,
                      {name.lower(): value for name, value in response.headers.items()},
                      response.read(),
                  )

          def get_json(path: str) -> dict:
              status, _, body = request(path)
              if status != 200:
                  raise AssertionError(f"{path} returned HTTP {status}")
              return json.loads(body.decode("utf-8"))

          for attempt in range(1, 121):
              try:
                  root_status, root_headers, _ = request("/")
                  if root_status != 200:
                      raise AssertionError(f"/ returned HTTP {root_status}")
                  deployed_release = root_headers.get("x-proto-release")
                  if deployed_release != expected_release:
                      raise AssertionError(
                          "event-journal gate is observing a stale deployment: "
                          f"expected={expected_release!r} got={deployed_release!r}"
                      )

                  ready = get_json("/events/ready")
                  verify = get_json("/events/journal/verify")

                  if ready.get("status") != "ready" or ready.get("ready") is not True:
                      raise AssertionError(f"event runtime is not ready: {ready!r}")
                  if verify.get("status") != "valid" or verify.get("chain_valid") is not True:
                      raise AssertionError(f"operational journal hash-chain is invalid: {verify!r}")
                  if int(verify.get("persistence_failures") or 0) != 0:
                      raise AssertionError(
                          f"operational journal persistence failures detected: {verify!r}"
                      )
                  if verify.get("persistence_enabled") is True:
                      event_count = int(verify.get("event_count") or 0)
                      persisted_count = int(verify.get("persisted_count") or 0)
                      if persisted_count > event_count:
                          raise AssertionError(
                              "persisted audit count exceeds in-process journal count"
                          )

                  print(
                      "production event journal contract: ok",
                      json.dumps(
                          {
                              "release": deployed_release,
                              "event_count": verify.get("event_count"),
                              "persisted_count": verify.get("persisted_count"),
                              "persistence_enabled": verify.get("persistence_enabled"),
                              "persistence_failures": verify.get("persistence_failures"),
                          },
                          sort_keys=True,
                      ),
                  )
                  break
              except (
                  AssertionError,
                  ValueError,
                  json.JSONDecodeError,
                  urllib.error.URLError,
                  TimeoutError,
                  OSError,
              ) as error:
                  last_error = error
                  print(f"attempt {attempt}/120 not ready: {type(error).__name__}: {error}")
                  if attempt == 120:
                      raise
                  time.sleep(5)
          else:
              raise RuntimeError(f"event journal contract exhausted retries: {last_error}")
          PY
