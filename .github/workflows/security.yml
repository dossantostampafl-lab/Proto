name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ../results
      - name: Enforce local CodeQL SARIF
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json

          files = glob.glob("../results/*.sarif")
          if not files:
              raise SystemExit("CodeQL SARIF missing; analysis did not complete")

          blocking = []
          total = 0
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  sarif = json.load(handle)
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      total += 1
                      level = result.get("level", "warning")
                      if level in {"error", "warning"}:
                          blocking.append(
                              (
                                  level,
                                  result.get("ruleId", "unknown"),
                                  result.get("message", {}).get("text", ""),
                              )
                          )

          print(f"CodeQL local SARIF results: {total}; blocking: {len(blocking)}")
          for level, rule, message in blocking[:50]:
              print(f"{level}: {rule}: {message}")
          if blocking:
              raise SystemExit(1)
          PY

  python-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e .
      - run: pip-audit

  rust-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject vulnerable rkyv if it enters the active graph
        run: |
          if cargo tree -e normal,build,dev | grep -qE 'rkyv v0\.7\.'; then
            echo 'rkyv 0.7 is active; remove or upgrade it before merging.' >&2
            exit 1
          fi
      - name: Cache pinned cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify cargo-audit version
        run: cargo audit --version
      - name: Audit Rust lockfile
        run: |
          # rust_decimal keeps rkyv 0.7 as an optional compatibility dependency in
          # lockfile resolution. The previous step proves it is not in the active graph.
          cargo audit --ignore RUSTSEC-2026-0235

  web-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
