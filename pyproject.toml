[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-quant"
version = "0.2.0"
description = "Prediction-market research terminal with read-only public crypto monitoring"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "polars>=1.32,<2",
  "scipy>=1.16,<2",
  "scikit-learn>=1.7,<2",
  "statsmodels>=0.14,<1",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "mutmut>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api.app*", "services*"]
exclude = ["apps.web*", "engines*", "tests*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services"]

[tool.mutmut]
source_paths = ["services/"]
only_mutate = ["services/events/reconciliation.py"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_events.py",
  "tests/unit/test_reconciliation_guard.py",
]
use_setproctitle = false
