services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql+asyncpg://proto:${PROTO_DB_PASSWORD:?set PROTO_DB_PASSWORD}@postgres:5432/proto_live
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: staging
      SYSTEM_MODE: LIVE_MONITORING
      LIVE_MONITORING_AUTOSTART: "true"
      LIVE_HISTORY_RETENTION_SECONDS: "86400"
      LIVE_HISTORY_QUERY_MAX: "1000"
      LIVE_HISTORY_PRUNE_EVERY_WRITES: "1000"
      LIVE_DATABASE_AUTO_CREATE: "false"
      DATABASE_URL: postgresql+asyncpg://proto:${PROTO_DB_PASSWORD:?set PROTO_DB_PASSWORD}@postgres:5432/proto_live
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_BACKEND: redis
      PERSISTENCE_ENABLED: "true"
      HTTP_RATE_LIMIT_PER_MINUTE: "600"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/live/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proto_live
      POSTGRES_USER: proto
      POSTGRES_PASSWORD: ${PROTO_DB_PASSWORD:?set PROTO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proto -d proto_live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - proto_live_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/live-alerts.yml:/etc/prometheus/live-alerts.yml:ro
      - proto_live_prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: proto
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    volumes:
      - proto_live_grafana:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  proto_live_pgdata:
  proto_live_prometheus:
  proto_live_grafana:
