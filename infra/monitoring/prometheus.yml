global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: proto-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - api:8000

  - job_name: proto-live-read-only
    metrics_path: /live/metrics/prometheus
    static_configs:
      - targets:
          - api:8000
