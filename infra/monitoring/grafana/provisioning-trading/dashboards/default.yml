apiVersion: 1

# Trading stack only (docker-compose.yml). The read-only live stack keeps ../provisioning.
providers:
  - name: Proto Live Monitoring
    orgId: 1
    folder: Proto
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
  - name: Proto Safety
    orgId: 1
    folder: Proto
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards-trading
