# Prometheus for the full trading stack (docker-compose.yml): the read-only live monitor plus the
# Phase 7 safety metrics. The read-only deployment (docker-compose.live.yml) keeps prometheus.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/live-alerts.yml
  - /etc/prometheus/safety-alerts.yml

scrape_configs:
  - job_name: proto-live-read-only
    metrics_path: /live/metrics/prometheus
    static_configs:
      - targets:
          - api:8000

  # Watchdog, halts, lockdown and journal integrity (docs/runbooks/incident.md).
  - job_name: proto-safety
    metrics_path: /v1/safety/metrics/prometheus
    static_configs:
      - targets:
          - api:8000
